name: Bypass & Cloud Auto-Port OrangeFox (M23 to M22)

on:
  workflow_dispatch:

jobs:
  porting:
    runs-on: ubuntu-latest
    steps:
    - name: Обход блокировок и парсинг ссылок XDA через сервер
      run: |
        # 1. Запрашиваем страницу TWRP M22 и вытаскиваем ссылку на файл
        echo "--> Парсинг темы M22..."
        M22_PAGE=$(curl -sL "https://xdaforums.com/t/shared-samsung-galaxy-m22-f22-twrp.4654924/")
        M22_URL=$(echo "$M22_PAGE" | grep -oP 'https://[^\s"]+(sourceforge|drive|mega|github)[^\s"]+' | head -n 1)
        
        # 2. Запрашиваем страницу OrangeFox M23 и вытаскиваем ссылку на файл
        echo "--> Парсинг темы M23..."
        M23_PAGE=$(curl -sL "https://xdaforums.com/t/unofficial-orangefox-recovery-project-ofrp-12-1-for-samsung-galaxy-m23.4623431/")
        M23_URL=$(echo "$M23_PAGE" | grep -oP 'https://[^\s"]+(sourceforge|drive|mega|github)[^\s"]+' | head -n 1)

        echo "Ссылка M22: $M22_URL"
        echo "Ссылка M23: $M23_URL"

        # Скачиваем файлы через сервер
        curl -sL -o twrp_m22.img "${M22_URL:-https://github.com/Physwizz/Samsung-Galaxy-M22-TWRP/releases/download/v1.0/twrp.img}"
        curl -sL -o ofox_m23.img "${M23_URL:-https://github.com/OrangeFox-Releases/m23/releases/download/v12.1/recovery.img}"

    - name: Установка утилит сборки (LineageOS Python Script)
      run: |
        wget -q https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-20.0/unpack_bootimg.py
        wget -q https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-20.0/mkbootimg.py
        chmod +x unpack_bootimg.py mkbootimg.py

    - name: Распаковка и замена ядра
      run: |
        mkdir m22_out m23_out
        python3 unpack_bootimg.py --boot_img twrp_m22.img --out m22_out
        
        ARGS=$(python3 unpack_bootimg.py --boot_img ofox_m23.img --out m23_out --format mkbootimg | sed 's/^mkbootimg //')
        
        cp m22_out/kernel m23_out/kernel
        if [ -f m22_out/dtb ]; then cp m22_out/dtb m23_out/dtb; fi
        
        python3 mkbootimg.py $ARGS -o ofox_m22_ported.img

    - name: Выдача готового файла (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Ported_OrangeFox_Samsung_M22
        path: ofox_m22_ported.img
