name: Cloud Auto-Port OrangeFox (M23 to M22)

on:
  workflow_dispatch:

jobs:
  porting:
    runs-on: ubuntu-latest
    steps:
    - name: Скачивание TWRP M22 и OrangeFox M23
      run: |
        curl -sL -o twrp_m22.img https://github.com/Physwizz/Samsung-Galaxy-M22-TWRP/releases/download/v1.0/twrp.img
        curl -sL -o ofox_m23.img https://github.com/OrangeFox-Releases/m23/releases/download/v12.1/recovery.img

    - name: Полный цикл портирования на чистом Python (Unpack + Repack)
      run: |
        python3 -c '
        import struct, os

        def unpack_img(filename):
            with open(filename, "rb") as f:
                header = f.read(1024)
                magic = header[:8]
                if magic != b"ANDROID!":
                    raise ValueError(f"Файл {filename} не является Android boot/recovery образом!")
                
                kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, second_size, second_addr, tags_addr, page_size = struct.unpack("<8I", header[8:40])
                
                # Читаем ядро
                f.seek(page_size, 0)
                kernel_data = f.read(kernel_size)
                
                # Читаем ramdisk
                ramdisk_pages = (kernel_size + page_size - 1) // page_size
                f.seek(page_size * (1 + ramdisk_pages), 0)
                ramdisk_data = f.read(ramdisk_size)
                
                return header, kernel_data, ramdisk_data, page_size

        print("--> Распаковка TWRP M22...")
        _, m22_kernel, _, _ = unpack_img("twrp_m22.img")
        
        print("--> Распаковка OrangeFox M23...")
        m23_header, _, m23_ramdisk, page_size = unpack_img("ofox_m23.img")
        
        print("--> Скрещивание ядра M22 и интерфейса OrangeFox M23...")
        
        # Пересчитываем размер нового ядра в заголовке
        new_kernel_size = len(m22_kernel)
        ramdisk_size = len(m23_ramdisk)
        
        # Обновляем структуру заголовка с новым размером ядра
        header_prefix = m23_header[:8] # "ANDROID!"
        header_suffix = m23_header[12:] # остальные параметры
        new_header = header_prefix + struct.pack("<I", new_kernel_size) + header_suffix
        
        # Собираем итоговый .img файл
        def pad_to_page(data, size):
            pad = (size - (len(data) % size)) % size
            return data + (b"\x00" * pad)

        with open("ofox_m22_ported.img", "wb") as out:
            out.write(pad_to_page(new_header[:page_size], page_size))
            out.write(pad_to_page(m22_kernel, page_size))
            out.write(pad_to_page(m23_ramdisk, page_size))
            
        print("--> ГОТОВО! Образ ofox_m22_ported.img успешно собран.")
        '

    - name: Выдача готового файла (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Ported_OrangeFox_Samsung_M22
        path: ofox_m22_ported.img
