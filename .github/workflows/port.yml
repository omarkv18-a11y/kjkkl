name: Cloud Auto-Port OrangeFox (M23 to M22)

on:
  workflow_dispatch:

jobs:
  porting:
    runs-on: ubuntu-latest
    steps:
    - name: Установка утилит и скачивание AIK (Android Image Kitchen)
      run: |
        # Ставим cpio (нужен для работы с ramdisk) и качаем AIK с GitHub
        sudo apt-get update && sudo apt-get install -y cpio
        git clone https://github.com/akhilnarang/AIK-Linux.git AIK

    - name: Скачивание TWRP M22 и OrangeFox M23 напрямую
      run: |
        # TWRP M22 (Донор ядра MTK)
        curl -sL -o twrp_m22.img https://github.com/Physwizz/Samsung-Galaxy-M22-TWRP/releases/download/v1.0/twrp.img

        # OrangeFox M23 (Интерфейс)
        curl -sL -o ofox_m23.img https://github.com/OrangeFox-Releases/m23/releases/download/v12.1/recovery.img

    - name: Магия Портирования (Скрещивание Kernels & UI через AIK)
      run: |
        # 1. Распаковываем TWRP M22
        cp twrp_m22.img AIK/
        cd AIK
        ./unpackimg.sh twrp_m22.img
        
        # Сохраняем ядро и dtb от MediaTek
        cp split_img/*-kernel ../m22_kernel 2>/dev/null || cp split_img/*-zImage ../m22_kernel 2>/dev/null
        cp split_img/*-dtb ../m22_dtb 2>/dev/null || true
        
        # Очищаем временные файлы
        ./cleanup.sh
        
        # 2. Распаковываем OrangeFox M23
        cp ../ofox_m23.img .
        ./unpackimg.sh ofox_m23.img
        
        # 3. Подменяем ядро Snapdragon на MediaTek
        cp ../m22_kernel split_img/*-kernel 2>/dev/null || cp ../m22_kernel split_img/*-zImage 2>/dev/null
        if [ -f ../m22_dtb ]; then
          cp ../m22_dtb split_img/*-dtb 2>/dev/null || true
        fi
        
        # 4. Собираем итоговое рекавери
        ./repackimg.sh
        cp image-new.img ../ofox_m22_ported.img

    - name: Выдача готового файла (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Ported_OrangeFox_Samsung_M22
        path: ofox_m22_ported.img
