name: Cloud Auto-Port OrangeFox (M23 to M22)

on:
  workflow_dispatch:

jobs:
  porting:
    runs-on: ubuntu-latest
    steps:
    - name: Установка утилит и скачивание AIK
      run: |
        sudo apt-get update && sudo apt-get install -y cpio
        
        # Перебираем зеркала AIK-Linux, чтобы обойти ошибку 128 (если кто-то удалил репо)
        git clone https://github.com/SebaUbuntu/AIK-Linux.git AIK || \
        git clone https://github.com/TogoFire/AIK-Linux.git AIK || \
        git clone https://github.com/brk3/AIK-Linux.git AIK || \
        git clone https://github.com/GameTheory-/AIK-Linux.git AIK
        
        # Выдаем права на все скрипты
        cd AIK && chmod -R +x *

    - name: Скачивание TWRP M22 и OrangeFox M23 напрямую
      run: |
        # TWRP M22 (Донор ядра MTK)
        curl -sL -o twrp_m22.img https://github.com/Physwizz/Samsung-Galaxy-M22-TWRP/releases/download/v1.0/twrp.img

        # OrangeFox M23 (Интерфейс)
        curl -sL -o ofox_m23.img https://github.com/OrangeFox-Releases/m23/releases/download/v12.1/recovery.img

    - name: Магия Портирования (Скрещивание Kernels & UI через AIK)
      run: |
        # 1. Распаковываем TWRP M22
        cp twrp_m22.img AIK/
        cd AIK
        ./unpackimg.sh twrp_m22.img
        
        # Безопасное сохранение ядра и dtb от MediaTek (чтобы не было ошибок с именами файлов)
        find split_img -name "*-zImage" -exec cp {} ../m22_kernel \;
        find split_img -name "*-kernel" -exec cp {} ../m22_kernel \;
        find split_img -name "*-dtb" -exec cp {} ../m22_dtb \;
        
        # Очищаем рабочую папку
        ./cleanup.sh
        
        # 2. Распаковываем OrangeFox M23
        cp ../ofox_m23.img .
        ./unpackimg.sh ofox_m23.img
        
        # 3. Подменяем ядро Snapdragon на MediaTek
        find split_img -name "*-zImage" -exec cp ../m22_kernel {} \;
        find split_img -name "*-kernel" -exec cp ../m22_kernel {} \;
        if [ -f ../m22_dtb ]; then
          find split_img -name "*-dtb" -exec cp ../m22_dtb {} \;
        fi
        
        # 4. Собираем итоговое рекавери
        ./repackimg.sh
        cp image-new.img ../ofox_m22_ported.img

    - name: Выдача готового файла (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Ported_OrangeFox_Samsung_M22
        path: ofox_m22_ported.img
