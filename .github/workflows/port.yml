name: Cloud Auto-Port OrangeFox (M23 to M22)

on:
  workflow_dispatch:

jobs:
  porting:
    runs-on: ubuntu-latest
    steps:
    - name: Установка системных утилит распаковки
      run: |
        sudo apt-get update
        sudo apt-get install -y abootimg android-sdk-libsparse-utils

    - name: Скачивание TWRP M22 и OrangeFox M23
      run: |
        # Скачиваем TWRP для Samsung M22 (Helio G80 Kernel)
        curl -sL -o twrp_m22.img https://github.com/Physwizz/Samsung-Galaxy-M22-TWRP/releases/download/v1.0/twrp.img

        # Скачиваем OrangeFox для Samsung M23 (UI & Scripts)
        curl -sL -o ofox_m23.img https://github.com/OrangeFox-Releases/m23/releases/download/v12.1/recovery.img

    - name: Магия Портирования (Замена ядра через abootimg)
      run: |
        # 1. Распаковываем TWRP M22 для извлечения ядра
        mkdir m22_out && cd m22_out
        abootimg -x ../twrp_m22.img
        cd ..

        # 2. Распаковываем OrangeFox M23
        mkdir m23_out && cd m23_out
        abootimg -x ../ofox_m23.img

        # 3. Заменяем ядро Snapdragon на родное MediaTek zImage
        cp ../m22_out/zImage ./zImage

        # 4. Обновляем и упаковываем OrangeFox с новым ядром
        abootimg -u ../ofox_m23.img -k zImage
        cp ../ofox_m23.img ./ofox_m22_ported.img

    - name: Выдача готового файла (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Ported_OrangeFox_Samsung_M22
        path: m23_out/ofox_m22_ported.img
