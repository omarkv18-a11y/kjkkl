name: Cloud Auto-Port OrangeFox (M23 to M22)

on:
  workflow_dispatch:

jobs:
  porting:
    runs-on: ubuntu-latest
    steps:
    - name: Скачивание TWRP M22 и OrangeFox M23
      run: |
        curl -sL -o twrp_m22.img https://github.com/Physwizz/Samsung-Galaxy-M22-TWRP/releases/download/v1.0/twrp.img
        curl -sL -o ofox_m23.img https://github.com/OrangeFox-Releases/m23/releases/download/v12.1/recovery.img

    - name: Скачивание официальных утилит Google AOSP (Чистый Python)
      run: |
        # Качаем скрипты напрямую с официального зеркала исходного кода Android
        curl -sL -o unpack_bootimg.py https://raw.githubusercontent.com/aosp-mirror/platform_system_tools_mkbootimg/master/unpack_bootimg.py
        curl -sL -o mkbootimg.py https://raw.githubusercontent.com/aosp-mirror/platform_system_tools_mkbootimg/master/mkbootimg.py
        chmod +x unpack_bootimg.py mkbootimg.py

    - name: Разбор образов и генерация своей утилиты сборки
      run: |
        # 1. Извлекаем донорское ядро MTK из TWRP
        mkdir m22_out
        python3 unpack_bootimg.py --boot_img twrp_m22.img --out m22_out
        
        # 2. Распаковываем OrangeFox и заставляем Питон сгенерировать аргументы сборки
        mkdir m23_out
        REPACK_ARGS=$(python3 unpack_bootimg.py --boot_img ofox_m23.img --out m23_out --format mkbootimg | sed 's/^mkbootimg //')
        
        # 3. Подменяем ядро и Device Tree на родные от MTK G80
        cp m22_out/kernel m23_out/kernel
        if [ -f m22_out/dtb ]; then cp m22_out/dtb m23_out/dtb; fi
        if [ -f m22_out/recovery_dtbo ]; then cp m22_out/recovery_dtbo m23_out/recovery_dtbo; fi
        
        # 4. Собираем финальный образ через созданную команду!
        python3 mkbootimg.py $REPACK_ARGS -o ofox_m22_ported.img

    - name: Выдача готового файла (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Ported_OrangeFox_Samsung_M22
        path: ofox_m22_ported.img
