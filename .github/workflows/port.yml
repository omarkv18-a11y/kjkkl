name: Cloud Auto-Port OrangeFox (M23 to M22)

on:
  workflow_dispatch:

jobs:
  porting:
    runs-on: ubuntu-latest
    steps:
    - name: Сборка Magiskboot из исходников
      run: |
        # Клонируем минимальный проект magiskboot и собираем бинарник
        git clone --depth=1 https://github.com/ellf/magiskboot-build.git mb_build
        cd mb_build
        make -j$(nproc)
        cp magiskboot ../magiskboot
        cd ..
        chmod +x magiskboot
        ./magiskboot

    - name: Скачивание TWRP M22 и OrangeFox M23 напрямую
      run: |
        # Скачиваем TWRP для Samsung M22 (Helio G80 Kernel)
        curl -sL -o twrp_m22.img https://github.com/Physwizz/Samsung-Galaxy-M22-TWRP/releases/download/v1.0/twrp.img

        # Скачиваем OrangeFox для Samsung M23 (UI & Scripts)
        curl -sL -o ofox_m23.img https://github.com/OrangeFox-Releases/m23/releases/download/v12.1/recovery.img

    - name: Магия Портирования (Скрещивание Kernels & UI)
      run: |
        # 1. Распаковываем TWRP от M22
        mkdir m22_out && cd m22_out
        ../magiskboot unpack ../twrp_m22.img
        cd ..

        # 2. Распаковываем OrangeFox от M23
        mkdir m23_out && cd m23_out
        ../magiskboot unpack ../ofox_m23.img

        # 3. Перекидываем родное ядро MediaTek в корпус OrangeFox
        cp ../m22_out/kernel .
        if [ -f ../m22_out/dtb ]; then cp ../m22_out/dtb .; fi

        # 4. Собираем итоговое рекавери
        ../magiskboot repack ../ofox_m23.img ofox_m22_ported.img

    - name: Выдача готового файла (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Ported_OrangeFox_Samsung_M22
        path: m23_out/ofox_m22_ported.img
