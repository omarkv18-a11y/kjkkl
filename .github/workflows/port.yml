name: Cloud Auto-Port OrangeFox (M23 to M22)

on:
  workflow_dispatch:

jobs:
  porting:
    runs-on: ubuntu-latest
    steps:
    - name: Установка Python и Android Boot Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip android-sdk-libsparse-utils
        pip3 install mkbootimg

    - name: Скачивание TWRP M22 и OrangeFox M23
      run: |
        # Скачиваем TWRP для Samsung M22 (Helio G80 Kernel)
        curl -sL -o twrp_m22.img https://github.com/Physwizz/Samsung-Galaxy-M22-TWRP/releases/download/v1.0/twrp.img

        # Скачиваем OrangeFox для Samsung M23 (UI & Scripts)
        curl -sL -o ofox_m23.img https://github.com/OrangeFox-Releases/m23/releases/download/v12.1/recovery.img

    - name: Магия Портирования (Разбор и замена ядра через unpack_bootimg)
      run: |
        # 1. Распаковываем TWRP M22 (вытаскиваем ядро MTK)
        mkdir m22_out
        unpack_bootimg --boot_img twrp_m22.img --out m22_out

        # 2. Распаковываем OrangeFox M23 (вытаскиваем ramdisk и параметры)
        mkdir m23_out
        unpack_bootimg --boot_img ofox_m23.img --out m23_out

        # 3. Собираем итоговое рекавери: берем ЯДРО от M22 и RAMDISK от OrangeFox M23
        mkbootimg \
          --kernel m22_out/kernel \
          --ramdisk m23_out/ramdisk \
          --header_version $(cat m23_out/header_version 2>/dev/null || echo 2) \
          -o ofox_m22_ported.img

    - name: Выдача готового файла (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Ported_OrangeFox_Samsung_M22
        path: ofox_m22_ported.img
