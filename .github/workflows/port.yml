name: Cloud Auto-Port OrangeFox (M23 to M22)

on:
  workflow_dispatch:

jobs:
  porting:
    runs-on: ubuntu-latest
    steps:
    - name: Скачивание TWRP M22 и OrangeFox M23
      run: |
        curl -sL -o twrp_m22.img https://github.com/Physwizz/Samsung-Galaxy-M22-TWRP/releases/download/v1.0/twrp.img
        curl -sL -o ofox_m23.img https://github.com/OrangeFox-Releases/m23/releases/download/v12.1/recovery.img

    - name: Собственный Python-распаковщик ядер (Без внешних скриптов)
      run: |
        python3 -c '
        import struct, os

        def unpack_img(filename, out_dir):
            os.makedirs(out_dir, exist_ok=True)
            with open(filename, "rb") as f:
                header = f.read(1024)
                magic = header[:8]
                if magic != b"ANDROID!":
                    print("Bad magic!")
                    return
                # Считываем размеры из Android Boot Header (v1/v2)
                kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, second_size, second_addr, tags_addr, page_size = struct.unpack("<8I", header[8:40])
                
                # Достаем ядро
                f.seek(page_size, 0)
                kernel_data = f.read(kernel_size)
                with open(os.path.join(out_dir, "kernel"), "wb") as kf:
                    kf.write(kernel_data)
                
                # Достаем ramdisk
                ramdisk_pages = (kernel_size + page_size - 1) // page_size
                f.seek(page_size * (1 + ramdisk_pages), 0)
                ramdisk_data = f.read(ramdisk_size)
                with open(os.path.join(out_dir, "ramdisk"), "wb") as rf:
                    rf.write(ramdisk_data)
                print(f"Распаковано {filename}: kernel {kernel_size} байт, ramdisk {ramdisk_size} байт")

        unpack_img("twrp_m22.img", "m22_out")
        unpack_img("ofox_m23.img", "m23_out")
        '

    - name: Замена ядра и сборка через стандартный mkbootimg
      run: |
        # Ставим официальный сборщик заголовков Android
        sudo apt-get update && sudo apt-get install -y android-sdk-libsparse-utils mkbootimg
        
        # Меняем ядро Snapdragon от M23 на родное ядро MTK от M22
        cp m22_out/kernel m23_out/kernel
        
        # Пересобираем итоговый образ OrangeFox
        mkbootimg --kernel m23_out/kernel --ramdisk m23_out/ramdisk --base 0x00000000 --pagesize 2048 -o ofox_m22_ported.img

    - name: Выдача готового файла (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Ported_OrangeFox_Samsung_M22
        path: ofox_m22_ported.img
